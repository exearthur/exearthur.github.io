    <!-- Marks the document as scripted before first paint, so scroll-reveal
         styles only ever hide content when the script that shows it will run. -->
    <script>document.documentElement.classList.add('js');</script>
    <!-- Welcome intro (src/components/ui/Intro.tsx): play it on the first
         visit of a session unless the visitor prefers reduced motion. The
         timeout releases the page if the app script never arrives. -->
    <script>
        (function () {
            try {
                if (sessionStorage.getItem('intro-seen')) return;
                if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                var root = document.documentElement;
                root.classList.add('show-intro');
                setTimeout(function () { root.classList.remove('show-intro'); }, 8000);
            } catch (e) {}
        })();
    </script>
